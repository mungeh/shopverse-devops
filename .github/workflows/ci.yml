name: ShopVerse CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

# Least-privilege permissions for this workflow.
permissions:
  contents: read

# Cancel an older CI run when newer code is pushed
# to the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE: lewis780/backend
  FRONTEND_IMAGE: lewis780/frontend

jobs:

  # =========================================================
  # BACKEND VALIDATION
  # =========================================================
  backend:
    name: Backend Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Verify Go dependencies
        run: go mod verify

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build backend
        run: go build -o /tmp/shopverse-backend ./cmd/main.go


  # =========================================================
  # FRONTEND VALIDATION
  # =========================================================
  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  # =========================================================
  # CONTAINER BUILD + SECURITY + REGISTRY PUBLISH
  # =========================================================
  container-security:
    name: Build, Scan and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Container images cannot be built until application
    # validation has succeeded.
    needs:
      - backend
      - frontend

    steps:
      # -----------------------------------------------------
      # Source
      # -----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # -----------------------------------------------------
      # Build images ONCE using the Git commit SHA
      # -----------------------------------------------------

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}


      # -----------------------------------------------------
      # Security Gate
      # -----------------------------------------------------

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"


      # -----------------------------------------------------
      # Docker Hub Authentication
      #
      # Only pushes to main may access Docker Hub credentials.
      # Pull requests stop after security scanning.
      # -----------------------------------------------------

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # -----------------------------------------------------
      # Publish EXACT images approved by Trivy
      #
      # No rebuild.
      # No "latest".
      # Git SHA only.
      # -----------------------------------------------------

      - name: Push approved backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"

      - name: Push approved frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${FRONTEND_IMAGE}:${GITHUB_SHA}"
