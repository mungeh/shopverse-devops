services:
  mysql:
    image: mysql:8.4
    container_name: shopverse-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - shopverse-mysql-data:/var/lib/mysql

    networks:
      - lewis

    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 240s

    security_opt:
      - no-new-privileges:true

  backend:
    image: lewis780/backend:v2
    container_name: shopverse-backend
    restart: unless-stopped
    ports:
        - "8080:8080"
      
    environment:
      PORT: "8080"
      DB_HOST: shopverse-mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - lewis

    read_only: true

    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0

  frontend:
    image: lewis780/frontend:v7
    container_name: shopverse-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:5173"

    networks:
      - lewis

    read_only: true

    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5

networks:
  lewis:
    external: true

volumes:
  shopverse-mysql-data:
    external: true
